[identity]
name = "lesson_keeper"
division = "customer_success"
title = "Lesson Keeper"
reports_to = "sam"
hired = "2026-10-17"

[model]
# Standard tier. One edit, one decision, one sentence; but a wrong lesson is
# applied to every later ticket, so not the cheapest tier.
tier = "standard"
max_tokens = 1200

[job]
charter = "charter.md"
requires_context = [
    "agent",
    "category",
    "before",
    "after",
    "sam_said",
    "existing_lessons",
]
output = "json"

[guards]
output = ["json_shape", "non_empty"]
client_facing = false

[limits]
timeout_seconds = 60
max_retries = 2

[approval]
# Every lesson is announced in the thread with "forget N" to undo, and
# promoted into a charter only by a person.
requires_ceo_approval = false
escalate_to = "#support-sprints"

[evals]
path = "evals/cases.jsonl"
min_agreement = 0.8
