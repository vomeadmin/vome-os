[identity]
name = "triage_director"
division = "customer_success"
title = "Director of Customer Success"
reports_to = "sam"
hired = "2026-09-28"

[model]
# Senior tier. This is the reasoning-heaviest job in the division: read a full
# thread, weigh partial evidence, and decide what a human should do next.
# Everything downstream inherits its category, so an error here is an error
# everywhere. This is the one place worth paying for the best model.
# Opus 5.5 since 2026-10-19 (Sam asked to move the senior agents for the
# 20% saving). The "premium" tier is Opus 5.5; effort is pinned at "high"
# because Opus 5.5 defaults to "medium" and this agent was tuned at Opus 5's
# "high". Evals that day matched Opus 5 for the support agents but dropped
# for bug_analyst (13/13 to 10/13), bug_report_analyst and kb_writer, so
# those stayed on the senior tier (Opus 5).
tier = "premium"
effort = "high"
# 3000, not 2000. A long thread (ticket #9477) ran out mid-JSON at 2000 and
# the json_shape guard threw the whole card away. Same lesson as bug_analyst.
# 12000 since 2026-10-23: at effort "high" the thinking shares this budget,
# and after ten rounds of tool results 4500 left little room to reason.
max_tokens = 12000

[job]
charter = "charter.md"
skills = [
    "triage-card-rules",
    "reading-a-ticket-thread",
    "checking-for-existing-work",
    "writing-the-triage-card",
    "deciding-not-to-act",
    "reading-ticket-images",
    "checking-the-code",
    "choosing-the-lane",
]
# Screenshots are shown, not just counted. Six covers every real thread seen
# so far once signatures are removed (#9415 had one, #9436 two). The kernel
# drops anything past this, oversized, or a duplicate.
images = 6
# Read-only code access (vomeos/tools.py). The card is internal, so this is
# allowed; the drafter that writes to customers is never given it.
# 25 calls since 2026-10-23 (was 10). On the Oct 21 backlog sweep 40 of 64
# runs hit the cap of 10 and 46 of 79 cards ended "unclear", saying in so
# many words what they had not read. grep_code / find_files work on a full
# copy of the live code; read_task reads what an engineer already found.
# Cards that still come back unsure go to the triage investigator
# (deep_triage.py), which has 60.
tools = ["search_code", "grep_code", "find_files", "read_code_file",
         "recent_commits", "read_task"]
max_tool_calls = 25
requires_context = [
    "ticket_number",
    "account",
    "thread",
    "attachments",
    "existing_tasks",
    "kb_matches",
]
output = "json"

[guards]
# Produces a triage card for an internal reviewer. It cannot write to a
# customer, so client_facing is false and the outbound guards do not apply.
# The drafting agent that comes later is the one that carries those.
output = ["json_shape", "non_empty"]
client_facing = false

[limits]
# Per request. A run with code checks makes several requests.
timeout_seconds = 180
max_retries = 2

[approval]
# Every card lands in front of a person. The agent never acts on its own
# recommendation, so no separate CEO gate is needed on the agent itself.
requires_ceo_approval = false
escalate_to = "#vome-tickets"

[evals]
path = "evals/cases.jsonl"
# Held higher than the 0.8 floor. This agent's category decides what every
# later agent does with the ticket, so it has to be right more often than a
# single-purpose checker.
min_agreement = 0.85
