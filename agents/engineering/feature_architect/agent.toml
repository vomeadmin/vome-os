[identity]
name = "feature_architect"
division = "engineering"
title = "Feature Architect"
reports_to = "sam"
hired = "2026-10-19"

[model]
# Premium tier. The whole value is judgement about shape: whether "a new
# form setting" is really a step setting, an option in an existing
# micro-setting, or a new step type. A cheaper model echoes the requester's
# proposed shape, and the requester's shape is exactly what Sam does not
# want built unexamined.
tier = "premium"
# Several items per post, each with options or a build plan.
max_tokens = 5000

[job]
charter = "charter.md"
skills = ["shaping-a-backend-change", "checking-for-existing-work"]
# Read-only code access on production and the dev branches. The output is an
# internal note in Slack and ClickUp, never a customer message.
tools = ["search_code", "read_code_file", "recent_commits"]
max_tool_calls = 18
requires_context = [
    "request",
    "requester",
    "thread",
    "linked_task",
    "existing_tasks",
    "previous_items",
    "sam_direction",
]
output = "json"

[guards]
output = ["json_shape", "non_empty"]
client_facing = false

[limits]
timeout_seconds = 300
max_retries = 2

[approval]
# An agent_build verdict leads to a pull request that Sam reviews and merges
# (fix_author, patch safety, never merged by an agent). Everything else is a
# note in the thread or on the requester's task.
requires_ceo_approval = false
escalate_to = "#feature-requests"

[evals]
path = "evals/cases.jsonl"
min_agreement = 0.8
