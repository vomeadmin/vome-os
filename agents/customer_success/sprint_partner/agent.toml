[identity]
name = "sprint_partner"
division = "customer_success"
title = "Support Sprint Partner"
reports_to = "sam"
hired = "2026-10-17"

[model]
# Senior tier. Sam is asking judgment questions about real customers ("what
# would you tell her", "is this the same bug as 9500") and the answer has to
# be right the first time; he is reviewing on a phone between other things.
# Opus 5.5 since 2026-10-19 (Sam asked to move the senior agents for the
# 20% saving). The "premium" tier is Opus 5.5; effort is pinned at "high"
# because Opus 5.5 defaults to "medium" and this agent was tuned at Opus 5's
# "high". Evals that day matched Opus 5 for the support agents but dropped
# for bug_analyst (13/13 to 10/13), bug_report_analyst and kb_writer, so
# those stayed on the senior tier (Opus 5).
tier = "premium"
effort = "high"
max_tokens = 2500

[job]
charter = "charter.md"
skills = [
    "reading-a-ticket-thread",
    "checking-for-existing-work",
    "learning-from-sam",
]
requires_context = [
    "now",
    "items_today",
    "conversation",
    "referenced_tickets",
    "product_knowledge",
    "sam_message",
]
output = "json"

[guards]
# Its reply goes to Sam, internally. Any draft it writes in an `edit` action
# is customer-facing and is checked separately, with every outbound guard,
# before it is stored (sprint_thread._check_draft). A send is never decided
# by this agent alone: the code requires Sam's own words to ask for it.
output = ["json_shape", "non_empty"]
client_facing = false

[limits]
timeout_seconds = 120
max_retries = 2

[approval]
requires_ceo_approval = false
escalate_to = "#support-sprints"

[evals]
path = "evals/cases.jsonl"
min_agreement = 0.8
