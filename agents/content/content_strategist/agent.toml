[identity]
name = "content_strategist"
division = "content"
title = "Content Strategist"
reports_to = "sam"
hired = "2026-10-17"

[model]
# Senior tier, for the same reason as content_producer: the hard part is
# judgment, not volume. Deciding what is genuinely new about a feature (as
# opposed to what Vome already did) and which single claim the video makes
# is the decision every later step inherits. A cheaper model gets it
# plausibly wrong, and then three concepts and a script are built on the
# wrong idea.
#
# It runs once per video thread. A few briefs a week is not a cost worth
# optimising against the risk.
tier = "senior"
# The brief is a small JSON object, but the senior model reasons first and
# that counts against this cap too.
max_tokens = 12000

[job]
charter = "charter.md"
skills = ["keeping-the-vome-video-voice"]
requires_context = [
    "feature_name",
    "faq_text",
    # What the person in the thread said. Often just "video on this" and a
    # link, sometimes a real steer ("for admins who already use forms").
    "brief",
    # A short text list of earlier videos: feature, format, angle, hook.
    # Required so the strategist can never position a video without
    # knowing what has already been said.
    "prior_videos",
    # The feature_scout's read: parent capability, is_new and its evidence.
    "scout",
    # Help centre articles about the rest of the parent capability, found by
    # the scout's queries. Required because the strategist positioned the
    # first real video from one article and missed the bigger picture: that
    # Vome already sends email from your own domain, on its own, at scale.
    "related_articles",
]
output = "json"

[guards]
# The output is a positioning brief the creative director reads, so the
# shape has to be right. Nothing it writes reaches a viewer directly.
output = ["json_shape", "non_empty"]
# False on the content_producer reasoning: this agent's output is read by
# other agents and then by a person in the thread who picks a concept and
# reviews the script before anything is built. It never writes to a
# customer and cannot publish anything.
client_facing = false

[limits]
timeout_seconds = 180
max_retries = 2

[approval]
# A person picks the concept and approves the script built on this brief.
# That is the real gate.
requires_ceo_approval = false
escalate_to = "#video-studio"

[evals]
path = "evals/cases.jsonl"
# Held at 0.8, as for content_producer. "Which claim is the single claim" is
# taste and reasonable people disagree. What has to be right every time is
# factual: nothing outside the FAQ, plan limits and prices in must_not_say,
# and whats_new naming the difference rather than the whole area.
min_agreement = 0.8
