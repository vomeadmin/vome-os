[identity]
name = "incident_matcher"
division = "customer_success"
title = "Incident Spotter"
reports_to = "sam"
hired = "2026-10-17"

[model]
# Fast tier. It runs on every new ticket and compares short summaries the
# triage director already wrote; the reading was done upstream.
tier = "fast"
max_tokens = 500

[job]
charter = "charter.md"
requires_context = ["new_ticket", "recent_tickets", "recent_errors"]
output = "json"

[guards]
output = ["json_shape", "non_empty"]
client_facing = false

[limits]
timeout_seconds = 45
max_retries = 2

[approval]
# Its effects are internal: a matching ticket joins the engineer task
# already filed for the same problem, and a second account makes it urgent
# (ticket_routing).
requires_ceo_approval = false
escalate_to = "#support-sprints"

[evals]
path = "evals/cases.jsonl"
min_agreement = 0.8
