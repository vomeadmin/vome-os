[identity]
name = "resolution_scope_check"
division = "customer_success"
title = "Resolution Scope Check"
reports_to = "sam"
hired = "2026-10-23"

[model]
# Standard tier. This is the last judgment before an unattended "it is
# fixed" email goes out, and it has to separate the problems a client raised
# from the side remarks around them, which wants real reasoning.
tier = "standard"
max_tokens = 500

[job]
charter = "charter.md"
skills = ["reading-a-ticket-thread", "deciding-not-to-act"]
requires_context = ["thread", "shipped_fixes"]
output = "json"

[guards]
output = ["json_shape", "non_empty"]
# Its verdict is read by resolution_scope.py only. The email it gates is
# guarded separately as a client message.
client_facing = false

[limits]
timeout_seconds = 60
max_retries = 2

[approval]
# Its only effect is to hold an automatic email for Sam. It never sends.
requires_ceo_approval = false
escalate_to = "#support-sprints"

[evals]
path = "evals/cases.jsonl"
min_agreement = 0.8
