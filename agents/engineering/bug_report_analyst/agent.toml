[identity]
name = "bug_report_analyst"
division = "engineering"
title = "Bug Report Analyst"
reports_to = "sam"
hired = "2026-10-19"

[model]
# Senior tier. Reports in #bug-reports come from people building on the
# product (Ron, writing with Claude), so they arrive with a theory, file
# names and a proposed fix. The job is to check that theory against the code
# rather than repeat it, and a confident echo of a wrong theory sends an
# engineer, or a pull request, the wrong way.
tier = "senior"
max_tokens = 4000

[job]
charter = "charter.md"
skills = []
# Read-only code access on the live branch, and on the integration and
# reporter branches allowed by VOMEOS_CODE_EXTRA_BRANCHES. The output is an
# internal note in Slack and ClickUp, never a customer message.
tools = ["search_code", "read_code_file", "recent_commits"]
max_tool_calls = 14
requires_context = [
    "report",
    "reporter",
    "thread",
    "linked_task",
    "existing_tasks",
]
output = "json"

[guards]
output = ["json_shape", "non_empty"]
client_facing = false

[limits]
timeout_seconds = 180
max_retries = 2

[approval]
# Its verdict can open a pull request (low risk, patch safety, never merged)
# or route to an engineer. Both are proposals a person reviews.
requires_ceo_approval = false
escalate_to = "#bug-reports"

[evals]
path = "evals/cases.jsonl"
min_agreement = 0.85
